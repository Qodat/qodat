name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Fork PRs get contents:read only. Cache download and the Cursor agent
# live in cache-watchdog.yaml and never run on pull_request.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # includeBuild("qodat-cache") substitutes com.displee:rs-cache-library.
          # Without the submodule the directory is empty and Gradle reports
          # "No matching variant of project :qodat-cache".
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        # xvfb: JavaFXExecutorTest starts a JFXPanel.
        # :qodat-bench is skipped unless a bench* task is requested.
        run: xvfb-run --auto-servernum ./gradlew test -x :qodat-bench:compileKotlin

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            build/reports/tests/test/
            **/build/reports/tests/test/
          if-no-files-found: ignore
