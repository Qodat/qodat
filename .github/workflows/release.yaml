name: Release

# Publish a desktop build with Hydraulic Conveyor.
# Triggers: tag v*, GitHub Release published, or workflow_dispatch.
# Does not run on ordinary branch pushes.
#
# Required GitHub secrets:
#   CONVEYOR_SIGNING_KEY — Hydraulic Conveyor signing key (PEM) consumed by
#     hydraulic-software/conveyor/actions/build as signing_key. Unsigned
#     local `make site` may still work; publishing to GitHub Releases and
#     gh-pages needs this plus contents:write (GITHUB_TOKEN is automatic).
#
# How to release:
#   1. Bump version in build.gradle.kts (or pass workflow_dispatch version).
#   2. Tag vX.Y.Z and push the tag, or Actions → Release → Run workflow
#      with publish=true (optional version override → -Kapp.version=).
#   3. Conveyor `make copied-site` uploads to GitHub Releases + gh-pages
#      (see conveyor.conf app.site.github).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Override Conveyor app.version (e.g. 0.4.2). Empty uses Gradle project version.
        required: false
        type: string
      publish:
        description: Upload to GitHub Releases and gh-pages
        type: boolean
        default: false
  push:
    tags:
      - "v*"
  release:
    types: [published]

concurrency:
  group: qodat-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'release' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build JARs
        run: ./gradlew jar -x :qodat-bench:compileKotlin

      - name: Package with Conveyor
        uses: hydraulic-software/conveyor/actions/build@v22.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: ${{ env.PUBLISH == 'true' && 'make copied-site' || 'make site' }}
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          agree_to_license: "1"
          conveyor_version: "16.0"
          extra_flags: >-
            --parallelism=2
            --cache-limit=4
            ${{ env.PUBLISH == 'true' && '' || '-Kapp.site.consistency-checks=warn' }}
            ${{ inputs.version != '' && format('-Kapp.version={0}', inputs.version) || '' }}

      - name: Upload Conveyor output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conveyor-output
          path: output/
          if-no-files-found: ignore
