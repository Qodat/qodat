name: Release

# Package a desktop build with Hydraulic Conveyor.
# Triggers: tag v*, GitHub Release published, or workflow_dispatch.
# Does not run on ordinary branch pushes.
#
# Signing stays local by default. Conveyor on this machine uses the macOS
# keychain (app.signing-key = keyring in
# ~/Library/Preferences/Hydraulic/Conveyor/defaults.conf). CI does not ask
# for a key upload.
#
# If CONVEYOR_SIGNING_KEY is already set on the repo or org, the signed
# path uses it as hydraulic-software/conveyor/actions/build signing_key
# (and may `make copied-site` when publish is requested).
# Otherwise workflow_dispatch (and any trigger without that secret) builds
# unsigned site artifacts only (`-Kapp.sign=false`); GitHub Releases and
# gh-pages are not updated.
#
# How to release a signed build (local, no GitHub secret):
#   conveyor make copied-site
# How to package in CI without a GitHub key:
#   Actions → Release → Run workflow (leave publish unchecked).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Override Conveyor app.version (e.g. 0.4.2). Empty uses Gradle project version.
        required: false
        type: string
      publish:
        description: Upload to GitHub Releases and gh-pages (signed path only)
        type: boolean
        default: false
  push:
    tags:
      - "v*"
  release:
    types: [published]

concurrency:
  group: qodat-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WANT_PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'release' || inputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build JARs
        run: ./gradlew jar -x :qodat-bench:compileKotlin

      - name: Unsigned package (no GitHub signing key)
        if: ${{ secrets.CONVEYOR_SIGNING_KEY == '' }}
        run: |
          echo "CONVEYOR_SIGNING_KEY is not set; building unsigned site artifacts."
          echo "Signed publishes stay on the machine that already has Conveyor keys."
          if [ "$WANT_PUBLISH" = "true" ]; then
            echo "::notice::publish skipped because CONVEYOR_SIGNING_KEY is not configured"
          fi

      - name: Package with Conveyor (signed)
        if: ${{ secrets.CONVEYOR_SIGNING_KEY != '' }}
        uses: hydraulic-software/conveyor/actions/build@v22.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: ${{ env.WANT_PUBLISH == 'true' && 'make copied-site' || 'make site' }}
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          agree_to_license: "1"
          conveyor_version: "16.0"
          extra_flags: >-
            --parallelism=2
            --cache-limit=4
            ${{ env.WANT_PUBLISH == 'true' && '' || '-Kapp.site.consistency-checks=warn' }}
            ${{ inputs.version != '' && format('-Kapp.version={0}', inputs.version) || '' }}

      - name: Package with Conveyor (unsigned)
        if: ${{ secrets.CONVEYOR_SIGNING_KEY == '' }}
        uses: hydraulic-software/conveyor/actions/build@v22.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: make site
          # Action requires a non-empty signing_key; unused because app.sign=false.
          signing_key: ci-unsigned-unused
          agree_to_license: "1"
          conveyor_version: "16.0"
          extra_flags: >-
            --parallelism=2
            --cache-limit=4
            -Kapp.sign=false
            -Kapp.site.consistency-checks=warn
            ${{ inputs.version != '' && format('-Kapp.version={0}', inputs.version) || '' }}

      - name: Upload Conveyor output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ secrets.CONVEYOR_SIGNING_KEY != '' && 'conveyor-output-signed' || 'conveyor-output-unsigned' }}
          path: output/
          if-no-files-found: ignore
