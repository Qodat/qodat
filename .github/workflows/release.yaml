name: Release

# Package a desktop build with Hydraulic Conveyor 22.
# Triggers: tag v*, GitHub Release published, or workflow_dispatch.
# Does not run on ordinary branch pushes.
#
# How 0.4.1 / 0.4.2 (and later) actually ship:
#   conveyor make copied-site
# on the machine that already has the macOS keychain signing key
# (app.signing-key = keyring in
# ~/Library/Preferences/Hydraulic/Conveyor/defaults.conf).
# Do not put CONVEYOR_SIGNING_KEY in this repo.
#
# CI paths:
#   - Signed + publish: CONVEYOR_SIGNING_KEY is already set, and the trigger
#     is a tag, a GitHub Release, or workflow_dispatch with publish=true.
#     Command: make copied-site.
#   - Signed, no publish: key present, workflow_dispatch with publish unchecked.
#     Command: make site.
#   - Unsigned package: no key, and publish was not requested.
#     Command: make site -Kapp.sign=false.
#   - Publish requested without a key: the job fails. It does not upload
#     unsigned artifacts as if they were a release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Override Conveyor app.version (e.g. 0.4.2). Empty uses Gradle project version.
        required: false
        type: string
      publish:
        description: Upload to GitHub Releases and gh-pages (signed path only)
        type: boolean
        default: false
  push:
    tags:
      - "v*"
  release:
    types: [published]

concurrency:
  group: qodat-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      WANT_PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'release' || inputs.publish }}
      # secrets is not allowed in step `if:`; promote presence to env first.
      HAS_SIGNING_KEY: ${{ secrets.CONVEYOR_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build JARs
        run: ./gradlew jar

      - name: Fail if publish cannot happen
        if: env.WANT_PUBLISH == 'true' && env.HAS_SIGNING_KEY != 'true'
        run: |
          echo "::error::Publish was requested (tag, GitHub Release, or publish=true) but CONVEYOR_SIGNING_KEY is not set."
          echo "Signed 0.4.x releases ship from a local machine: conveyor make copied-site"
          echo "For an unsigned CI package, use workflow_dispatch and leave publish unchecked."
          exit 1

      - name: Package with Conveyor (signed)
        if: env.HAS_SIGNING_KEY == 'true'
        uses: hydraulic-software/conveyor/actions/build@v22.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: ${{ env.WANT_PUBLISH == 'true' && 'make copied-site' || 'make site' }}
          signing_key: ${{ secrets.CONVEYOR_SIGNING_KEY }}
          agree_to_license: "1"
          conveyor_version: "22.1"
          extra_flags: >-
            --parallelism=2
            --cache-limit=4
            ${{ env.WANT_PUBLISH == 'true' && '' || '-Kapp.site.consistency-checks=warn' }}
            ${{ inputs.version != '' && format('-Kapp.version={0}', inputs.version) || '' }}

      - name: Package with Conveyor (unsigned)
        if: env.HAS_SIGNING_KEY != 'true'
        uses: hydraulic-software/conveyor/actions/build@v22.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: make site
          # Action requires a non-empty signing_key; unused because app.sign=false.
          signing_key: ci-unsigned-unused
          agree_to_license: "1"
          conveyor_version: "22.1"
          extra_flags: >-
            --parallelism=2
            --cache-limit=4
            -Kapp.sign=false
            -Kapp.site.consistency-checks=warn
            ${{ inputs.version != '' && format('-Kapp.version={0}', inputs.version) || '' }}

      - name: Upload Conveyor output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.HAS_SIGNING_KEY == 'true' && 'conveyor-output-signed' || 'conveyor-output-unsigned' }}
          path: output/
          if-no-files-found: ignore
