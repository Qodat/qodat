kotlin.code.style=official

# Safe Gradle 9.7 wins with includeBuild("qodat-cache") + JavaFX.
# Configuration cache is off: the included qodat-cache build applies Kotlin 1.9
# and kotlinx-benchmark, which register an unsupported BuildEventsListenerRegistry
# completion listener (store fails; warn-mode still cannot reuse). Re-evaluate
# after that library is on Kotlin 2.x without the benchmark plugin on the jar path.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Incremental compile is the KGP default; pin a dedicated Kotlin daemon heap so
# it does not fight the Gradle daemon for the 2g above.
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1g
