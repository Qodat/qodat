// Keep this file in sync with Gradle via the Conveyor plugin.
//
// Releases 0.4.1 / 0.4.2 (and later) ship from a signed local machine:
//   conveyor make copied-site
// GitHub Actions Release is unsigned unless CONVEYOR_SIGNING_KEY is already
// set on the repo — it must fail, not silently skip, when publish is requested
// without that key. Do not commit the key.
include "#!./gradlew --console=plain --quiet printConveyorConfig"

app {
  icons = "conveyor_assets/icon/client-icon-*.png"

  vcs-url = "github.com/Qodat/qodat"

  // Conveyor 22 default is background (Sparkle hourly / Windows every 8h).
  // Aggressive checks the feed on every launch and applies before the app
  // starts — needed on Windows (App Installer often never applies) and Mac
  // (0.3.x shipped background + silent apply-on-quit, so updates felt dead).
  // Linux ignores this; apt still owns upgrades.
  updates = aggressive

  mac {
    // Level 18+ already defaults this to 11.0; keep the pin explicit.
    info-plist.LSMinimumSystemVersion = "11.0.0"

    // Conveyor 22 Sparkle defaults when updates=aggressive. Lock them so a
    // future CLI default cannot drop back to prompt-only / no scheduled check.
    // SUFeedURL and SUPublicEDKey are filled in at package time from site.base-url
    // and the keyring signing key — do not put those values in git.
    sparkle-options {
      SUEnableAutomaticChecks = true
      SUAutomaticallyUpdate = true
      SUAllowsAutomaticUpdates = true
      SUShowReleaseNotes = false
      SUScheduledCheckInterval = 3600
    }
  }

  // 0.3.3 already has the escape hatch; this makes it reinstall when behind
  // instead of waiting for the Windows background updater.
  windows.manifests.msix.update-escape-hatch.run-if = not-up-to-date

  site {
    // Sparkle SUFeedURL and the Control API repositoryUrl are this URL plus
    // appcast-*.rss / metadata.properties. copied-site puts those on GitHub
    // Releases. gh-pages only gets download.html + icons — a 404 for the
    // appcast on qodat.github.io is expected, not a broken feed.
    //
    // Extra site inputs (qodat-site.css) are NOT copied to Pages. After
    // `copied-site`, push conveyor_assets/site/qodat-site.css to gh-pages
    // (or the relative href 404s and the page falls back to Conveyor lime).
    // Do not load the theme from Releases — copied-site does not upload it.
    base-url = "https://github.com/Qodat/qodat/releases/latest/download"

    display-name = "Qodat"
    theme = dark
    inputs += "conveyor_assets/site/*" -> .
    extra-header-html = """
      <meta name="color-scheme" content="dark">
      <meta name="theme-color" content="#3C3F41">
      <meta name="description" content="A RuneScape cache explorer for models, animations, and interfaces.">
      <link rel="apple-touch-icon" href="icon.png">
      <link rel="stylesheet" href="qodat-site.css?v=2">
      <style>
        #panes.pane::before, #no-go.pane::before, .pane::before { content: none !important; display: none !important; }
      </style>
      <script>
        document.addEventListener("DOMContentLoaded", function () {
          if (document.querySelector(".qodat-header")) return;
          var container = document.querySelector(".container");
          var panes = document.getElementById("panes");
          var logo = document.getElementById("logo");
          var title = document.getElementById("title");
          var badge = document.getElementById("conveyor-logo");
          if (!container || !panes || !logo || !title) return;
          var wrap = panes.parentNode;
          var header = document.createElement("header");
          header.className = "qodat-header";
          var brand = document.createElement("div");
          brand.className = "qodat-brand";
          var text = document.createElement("div");
          text.className = "qodat-brand-text";
          var tag = document.querySelector(".qodat-tagline") || document.createElement("p");
          tag.className = "qodat-tagline";
          tag.textContent = "A RuneScape cache explorer for models, animations, and interfaces.";
          text.appendChild(title);
          text.appendChild(tag);
          brand.appendChild(logo);
          brand.appendChild(text);
          header.appendChild(brand);
          var main = document.createElement("main");
          main.className = "qodat-main";
          var nogo = document.getElementById("no-go");
          if (nogo) main.appendChild(nogo);
          main.appendChild(panes);
          var footer = document.createElement("footer");
          footer.className = "qodat-footer";
          if (badge) footer.appendChild(badge);
          container.insertBefore(header, container.firstChild);
          container.appendChild(main);
          container.appendChild(footer);
          if (wrap && wrap !== container && wrap !== main && !wrap.id) wrap.remove();
          document.body.classList.add("qodat-site");
        });
      </script>
    """

    github {
      oauth-token = ${env.GITHUB_TOKEN}
      pages-branch = "gh-pages"
    }
  }
}

// JDK 25 is imported by printConveyorConfig. Conveyor 21+ resolves
// /stdlib/jdk/25. Pin the CLI to 22.1+ (`npx @hydraulic/conveyor@22.1.0`
// or a PATH install at that version). Level 22 is the current major.
conveyor.compatibility-level = 22
