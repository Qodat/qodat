// Keep this file in sync with Gradle via the Conveyor plugin.
include "#!./gradlew --console=plain --quiet printConveyorConfig"

app {
  icons = "conveyor_assets/icon/client-icon-*.png"

  vcs-url = "github.com/Qodat/qodat"

  // Conveyor's own updatecheck.exe on every launch. Windows background
  // App Installer checks against GitHub Releases often never apply.
  updates = aggressive

  // 0.3.3 already has the escape hatch; this makes it reinstall when behind
  // instead of waiting for the Windows background updater.
  windows.manifests.msix.update-escape-hatch.run-if = not-up-to-date

  site {
    github {
      oauth-token = ${env.GITHUB_TOKEN}
      pages-branch = "gh-pages"
    }
  }
}

// JDK 25 is imported by printConveyorConfig. Conveyor 16.0 cannot resolve
// /stdlib/jdk/25; local publish needs Conveyor 21+. Keep level 16 (18+
// raises the macOS minimum).
conveyor.compatibility-level = 16
